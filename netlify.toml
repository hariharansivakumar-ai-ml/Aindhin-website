[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "http://www.aindhin.com/*"
  to = "https://aindhin.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.aindhin.com/*"
  to = "https://aindhin.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://api2.aindhin.com/api/sitemap.xml"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caching for images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"
    Expires = "1 year"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"
    Expires = "1 year"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"
    Expires = "1 year"

# Caching for fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Expires = "1 year"

# Caching for build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prevent caching of index.html to ensure clients load the latest chunk references after a new deployment
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
